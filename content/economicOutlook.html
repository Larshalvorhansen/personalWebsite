<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Economic Outλook — Monthly Articles</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Bentham&family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #fbfaf7;
        --ink: #1f2929;
        --muted: #71807e;
        --line: #dddeda;
        --accent: #2966ce;
        --soft: #e9eeed;
        --sidebar: 244px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 35px;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Space Grotesk", Arial, sans-serif;
        font-size: 17px;
        line-height: 1.7;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:hover {
        color: var(--accent);
      }
      button {
        font: inherit;
      }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: var(--sidebar);
        padding: 33px 21px 28px 28px;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        background: var(--paper);
        z-index: 5;
      }
      .brand {
        display: block;
        line-height: 1.1;
      }
      .brand-wordmark {
        display: block;
        width: min(190px, 100%);
        height: auto;
      }
      .brand-mini {
        display: block;
        width: 162px;
        max-width: 100%;
        height: auto;
      }
      .brand span,
      .lambda {
        color: var(--accent);
      }
      .eyebrow {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.9px;
        font-weight: 700;
        color: var(--muted);
      }
      .sidebar .eyebrow {
        margin-top: 7px;
      }
      .navgroup {
        margin-top: 43px;
      }
      .navlabel {
        font-size: 10px;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 1.7px;
        text-transform: uppercase;
        margin: 0 0 12px 12px;
      }
      .navlink {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
        color: #54625f;
        font-weight: 600;
        transition:
          background 0.2s,
          color 0.2s;
        border-left: 3px solid transparent;
      }
      .navlink:hover {
        background: #edf1ee;
      }
      .navlink.active {
        background: var(--soft);
        color: #1b3432;
        border-left-color: var(--accent);
      }
      .navlink .count {
        font-size: 11px;
        color: #8c9792;
      }
      .navlink.article-link {
        font-size: 12px;
        line-height: 1.35;
        font-weight: 500;
        padding-top: 9px;
        padding-bottom: 9px;
      }
      .navlink .nav-number {
        font-size: 10px;
        color: var(--accent);
        font-weight: 700;
        min-width: 21px;
      }
      .navhint {
        margin: 20px 12px 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
      }
      .sidebar-bottom {
        margin-top: auto;
        border-top: 1px solid var(--line);
        padding-top: 18px;
      }
      .sidebar-bottom p {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.7;
        margin: 0 0 11px;
      }
      .sidebar-bottom a {
        font-size: 12px;
        color: var(--accent);
        font-weight: 700;
      }
      .shell {
        margin-left: var(--sidebar);
        min-height: 100vh;
      }
      .content {
        max-width: 820px;
        margin: 0 auto;
        padding: 70px 68px 100px;
      }
      .masthead {
        border-bottom: 1px solid var(--line);
        padding-bottom: 48px;
        margin-bottom: 48px;
      }
      .hero-title {
        margin: 24px 0 26px;
      }
      .hero-logo {
        display: block;
        width: min(920px, 100%);
        height: auto;
        filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.02));
      }
      .lead {
        font-size: 20px;
        line-height: 1.6;
        max-width: 640px;
        margin: 0 0 12px;
      }
      .intro {
        color: #66716f;
        font-size: 15px;
        line-height: 1.85;
        margin: 0;
        max-width: 640px;
      }
      .topline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
      }
      .edition {
        font-size: 11px;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }
      .status {
        background: #edf1ec;
        padding: 18px 21px;
        border-left: 3px solid #8da79f;
        margin-bottom: 54px;
        font-size: 14px;
        line-height: 1.7;
        color: #4a5755;
      }
      .status strong {
        color: #263b35;
      }
      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 19px;
      }
      .section-heading h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin: 0;
      }
      .section-heading span {
        font-size: 12px;
        color: var(--muted);
      }
      article {
        padding: 34px 0 48px;
        border-top: 1px solid var(--line);
        scroll-margin-top: 32px;
      }
      .meta {
        display: flex;
        gap: 14px;
        align-items: center;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1.2px;
        font-weight: 700;
        font-size: 10px;
      }
      .dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #aeb5b1;
      }
      .post-title {
        font-family: Bentham, Georgia, serif;
        font-size: clamp(34px, 4.3vw, 48px);
        font-weight: 400;
        letter-spacing: -1px;
        line-height: 1.15;
        margin: 12px 0 15px;
      }
      .post-copy {
        font-size: 17px;
        line-height: 1.88;
        margin: 0 0 16px;
      }
      .post-copy strong {
        font-weight: 700;
      }
      .feature {
        height: 230px;
        overflow: hidden;
        margin: 25px 0 10px;
        background: #dbe3e1;
        position: relative;
      }
      .feature svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .caption {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.55;
        margin: 0 0 18px;
      }
      .source {
        font-size: 12px;
        color: #6d7974;
      }
      .source a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .divider-label {
        margin: 35px 0 0;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--muted);
        font-weight: 700;
      }
      .newsletter {
        border-top: 1px solid var(--line);
        padding-top: 36px;
        margin-top: 35px;
        scroll-margin-top: 32px;
      }
      .newsletter h2 {
        font-family: Bentham, Georgia, serif;
        font-size: 41px;
        font-weight: 400;
        line-height: 1.2;
        margin: 0 0 10px;
      }
      .newsletter p {
        font-size: 15px;
        color: var(--muted);
        margin: 0 0 20px;
      }
      .fake-form {
        display: flex;
        gap: 8px;
      }
      .fake-form input {
        border: 1px solid #cad0ca;
        background: #fff;
        padding: 14px;
        font-size: 14px;
        flex: 1;
        min-width: 0;
      }
      .fake-form button {
        border: 0;
        background: #263d3b;
        color: white;
        padding: 14px 22px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }
      .fake-form button:hover {
        background: #38635d;
      }
      .demo-note {
        display: none;
        font-size: 12px !important;
        color: var(--accent) !important;
        margin-top: 10px !important;
      }
      .mobile-bar,
      .scrim {
        display: none;
      }
      @media (max-width: 1050px) {
        :root {
          --sidebar: 205px;
        }
        .sidebar {
          padding-left: 18px;
          padding-right: 16px;
        }
        .content {
          padding: 55px 46px 90px;
        }
        .hero-title {
          font-size: clamp(40px, 5.2vw, 60px);
        }
      }
      @media (max-width: 720px) {
        :root {
          --sidebar: 0px;
        }
        .mobile-bar {
          position: sticky;
          top: 0;
          z-index: 10;
          display: flex;
          justify-content: space-between;
          align-items: center;
          background: rgba(251, 250, 247, 0.97);
          border-bottom: 1px solid var(--line);
          height: 58px;
          padding: 0 19px;
        }
        .mobile-bar .brand {
          display: flex;
          align-items: center;
        }
        .mobile-bar .brand-mini {
          width: 135px;
        }
        .menu-toggle {
          background: none;
          border: 1px solid var(--line);
          padding: 5px 12px;
          font-size: 13px;
          cursor: pointer;
        }
        .sidebar {
          width: 260px;
          transform: translateX(-105%);
          transition: transform 0.25s;
          box-shadow: 5px 0 24px #0000000d;
          top: 0;
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .scrim.show {
          display: block;
          position: fixed;
          inset: 0;
          background: #0006;
          z-index: 4;
        }
        .shell {
          margin: 0;
        }
        .content {
          padding: 37px 22px 70px;
        }
        .masthead {
          margin-bottom: 28px;
          padding-bottom: 31px;
        }
        .hero-title {
          font-size: clamp(35px, 8vw, 61px);
          letter-spacing: -2px;
        }
        .lead {
          font-size: 19px;
        }
        .post-copy {
          font-size: 17px;
        }
        .topline {
          align-items: flex-start;
        }
        .edition {
          font-size: 10px;
        }
        .feature {
          height: 180px;
        }
      }
      .loading-copy {
        color: var(--muted);
        font-size: 15px;
        padding: 20px 0;
      }
      .month-chip {
        display: inline-block;
        color: var(--accent);
        letter-spacing: 1px;
        text-transform: uppercase;
        font-weight: 700;
        font-size: 11px;
      }
      .post-image {
        display: block;
        max-width: 100%;
        height: auto;
        max-height: 480px;
        object-fit: contain;
        margin: 23px 0 6px;
      }
      .source-list {
        font-size: 13px;
        line-height: 1.7;
        color: var(--muted);
        overflow-wrap: anywhere;
        margin: 12px 0 0;
      }
      .source-list a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .rich-copy p {
        margin: 0 0 15px;
      }
      .rich-copy {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .rich-copy ul,
      .rich-copy ol {
        padding-left: 1.4rem;
      }
      .rich-copy a {
        color: var(--accent);
        text-decoration: underline;
      }
      .year-block {
        scroll-margin-top: 28px;
      }
      .year-block .section-heading {
        margin-top: 38px;
      }
      .post-title {
        margin-top: 9px;
      }
      .article-label {
        font-size: 11px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--muted);
        margin: 18px 0 5px;
      }
      .post-date {
        font-size: 12px;
        color: var(--muted);
      }

      /* Clear year/month hierarchy */
      .year-block {
        margin-top: 65px;
      }
      .year-block:first-child {
        margin-top: 0;
      }
      .year-block > .section-heading {
        border-bottom: 2px solid var(--ink);
        padding-bottom: 14px;
        margin: 0 0 6px;
      }
      .year-block > .section-heading h2 {
        font-family: Bentham, Georgia, serif;
        font-size: clamp(40px, 5vw, 58px);
        letter-spacing: -1.5px;
        text-transform: none;
        line-height: 1.05;
        color: var(--ink);
      }
      .year-block article {
        border-top: 1px solid var(--line);
        padding-top: 27px;
      }
      .year-block article:first-of-type {
        border-top: 0;
      }
      .year-block .post-title {
        margin: 2px 0 27px;
      }
      .year-block .article-label {
        font-size: 15px;
        letter-spacing: 0.2px;
        text-transform: none;
        color: var(--ink);
        font-weight: 800;
        margin: 24px 0 6px;
      }
      .year-block .post-copy {
        font-size: 18px;
        line-height: 1.85;
      }
      @media (max-width: 720px) {
        .year-block {
          margin-top: 44px;
        }
        .year-block .article-label {
          font-size: 14px;
        }
        .year-block .post-copy {
          font-size: 17px;
        }
      }

      /* Nested monthly archive in the left sidebar */
      .sidebar nav {
        overflow-y: auto;
        min-height: 0;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        padding-right: 3px;
      }
      .nav-year {
        border-top: 1px solid var(--line);
        padding: 10px 0 9px;
      }
      .nav-year:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .navlink.nav-year-heading {
        font-size: 14px;
        font-weight: 800;
        color: var(--ink);
        letter-spacing: 0.3px;
        padding: 7px 11px;
      }
      .nav-months {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 3px;
        padding: 4px 4px 3px 12px;
      }
      .navlink.nav-month-link {
        font-size: 12px;
        font-weight: 600;
        justify-content: center;
        text-align: center;
        padding: 7px 2px;
        border-left: 0;
        border-radius: 5px;
      }
      .navlink.nav-month-link.active {
        background: var(--accent);
        color: #fff;
      }
      .sidebar .navgroup {
        margin-top: 26px;
      }
      .sidebar-bottom {
        flex-shrink: 0;
        margin-top: auto;
        padding-top: 13px;
      }
      .hero-title {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div class="mobile-bar">
      <a href="#home" class="brand" aria-label="Economic Outlambdaook home"
        ><img
          src="./eo/eo.webp"
          alt="Economic Outlambdaook"
          class="brand-mini" /></a
      ><button
        class="menu-toggle"
        id="menu-toggle"
        aria-expanded="false"
        aria-controls="sidebar"
      >
        ☰ Menu
      </button>
    </div>
    <div class="scrim" id="scrim"></div>
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a href="#home" class="brand" aria-label="Economic Outlambdaook home"
        ><img
          src="./eo/eo.webp"
          alt="Economic Outlambdaook"
          class="brand-wordmark"
      /></a>
      <nav aria-label="Article navigation">
        <div class="navgroup">
          <a href="#newsletter" class="navlink">Newsletter <span>↗</span></a>
        </div>
        <div class="navgroup" style="margin-top: 35px">
          <p class="navlabel">Navigation</p>
          <div id="year-navigation">
            <span class="navhint">Loading archive…</span>
          </div>
        </div>
      </nav>
      <div class="sidebar-bottom">
        <p>Notes on economics, geopolitics, and the forces shaping tomorrow.</p>
        <a href="https://halvorhansen.no" target="_blank" rel="noopener"
          >← halvorhansen.no</a
        >
      </div>
    </aside>
    <div class="shell">
      <main class="content" id="home">
        <header class="masthead">
          <h1 class="hero-title">
            <img
              src="./eo/eo.webp"
              alt="Economic Outlambdaook"
              class="hero-logo"
            />
          </h1>
        </header>
      </main>
    </div>
  </body>
</html>
