<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Economic Outλook — Monthly Articles</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Bentham&family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #fbfaf7;
        --ink: #1f2929;
        --muted: #71807e;
        --line: #dddeda;
        --accent: #2966ce;
        --soft: #e9eeed;
        --sidebar: 244px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 35px;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Space Grotesk", Arial, sans-serif;
        font-size: 17px;
        line-height: 1.7;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:hover {
        color: var(--accent);
      }
      button {
        font: inherit;
      }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: var(--sidebar);
        padding: 33px 21px 28px 28px;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        background: var(--paper);
        z-index: 5;
      }
      .brand {
        display: block;
        line-height: 1.1;
      }
      .brand-wordmark {
        display: block;
        width: min(190px, 100%);
        height: auto;
      }
      .brand-mini {
        display: block;
        width: 162px;
        max-width: 100%;
        height: auto;
      }
      .brand span,
      .lambda {
        color: var(--accent);
      }
      .eyebrow {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.9px;
        font-weight: 700;
        color: var(--muted);
      }
      .sidebar .eyebrow {
        margin-top: 7px;
      }
      .navgroup {
        margin-top: 43px;
      }
      .navlabel {
        font-size: 10px;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 1.7px;
        text-transform: uppercase;
        margin: 0 0 12px 12px;
      }
      .navlink {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
        color: #54625f;
        font-weight: 600;
        transition:
          background 0.2s,
          color 0.2s;
        border-left: 3px solid transparent;
      }
      .navlink:hover {
        background: #edf1ee;
      }
      .navlink.active {
        background: var(--soft);
        color: #1b3432;
        border-left-color: var(--accent);
      }
      .navlink .count {
        font-size: 11px;
        color: #8c9792;
      }
      .navlink.article-link {
        font-size: 12px;
        line-height: 1.35;
        font-weight: 500;
        padding-top: 9px;
        padding-bottom: 9px;
      }
      .navlink .nav-number {
        font-size: 10px;
        color: var(--accent);
        font-weight: 700;
        min-width: 21px;
      }
      .navhint {
        margin: 20px 12px 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
      }
      .sidebar-bottom {
        margin-top: auto;
        border-top: 1px solid var(--line);
        padding-top: 18px;
      }
      .sidebar-bottom p {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.7;
        margin: 0 0 11px;
      }
      .sidebar-bottom a {
        font-size: 12px;
        color: var(--accent);
        font-weight: 700;
      }
      .shell {
        margin-left: var(--sidebar);
        min-height: 100vh;
      }
      .content {
        max-width: 820px;
        margin: 0 auto;
        padding: 70px 68px 100px;
      }
      .masthead {
        border-bottom: 1px solid var(--line);
        padding-bottom: 48px;
        margin-bottom: 48px;
      }
      .hero-title {

      }
      .hero-logo {

        width: min(920px, 100%);
        height: auto;
        filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.02));
      }
      .lead {
        font-size: 20px;
        line-height: 1.6;
        max-width: 640px;

      .intro {

      .edition {

      .section-heading {

      .section-heading h2 {

      }
      .demo-note {
        display: none;
        font-size: 12px !important;
        color: var(--accent) !important;
        margin-top: 10px !important;

      .mobile-bar,
      .scrim {

      @media (max-width: 1050px) {
        :root {
          --sidebar: 205px;

        .sidebar {
          padding-left: 18px;
          padding-right: 16px;
        }
        .content {
          padding: 55px 46px 90px;
        }
        .hero-title {
          font-size: clamp(40px, 5.2vw, 60px);
        }

          top: 0;
          z-index: 10;
          display: flex;
          justify-content: space-between;
          align-items: center;

          border-bottom: 1px solid var(--line);

          padding: 0 19px;

        .mobile-bar .brand {

        .menu-toggle {

          width: 260px;
          transform: translateX(-105%);

          position: fixed;
          inset: 0;
          background: #0006;

          margin: 0;

        .content {

        .masthead {

          padding-bottom: 31px;

        .hero-title {
          font-size: clamp(35px, 8vw, 61px);
          letter-spacing: -2px;
        }
        .lead {
          font-size: 19px;
        }
        .post-copy {
          font-size: 17px;
        }
        .topline {
          align-items: flex-start;
        }
        .edition {

        }

          height: 180px;
        }

      .loading-copy {
        color: var(--muted);
        font-size: 15px;
        padding: 20px 0;
      }
      .month-chip {
        display: inline-block;
        color: var(--accent);
        letter-spacing: 1px;
        text-transform: uppercase;
        font-weight: 700;
        font-size: 11px;
      }
      .post-image {
        display: block;
        max-width: 100%;
        height: auto;
        max-height: 480px;
        object-fit: contain;
        margin: 23px 0 6px;
      }
      .source-list {
        font-size: 13px;
        line-height: 1.7;
        color: var(--muted);
        overflow-wrap: anywhere;
        margin: 12px 0 0;
      }
      .source-list a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .rich-copy p {
        margin: 0 0 15px;
      }
      .rich-copy {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .rich-copy ul,
      .rich-copy ol {
        padding-left: 1.4rem;
      }
      .rich-copy a {
        color: var(--accent);
        text-decoration: underline;
      }
      .year-block {
        scroll-margin-top: 28px;
      }
      .year-block .section-heading {
        margin-top: 38px;
      }
      .post-title {
        margin-top: 9px;
      }
      .article-label {
        font-size: 11px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--muted);
        margin: 18px 0 5px;
      }
      .post-date {
        font-size: 12px;
        color: var(--muted);
      }

      /* Clear year/month hierarchy */
      .year-block {
        margin-top: 65px;
      }
      .year-block:first-child {
        margin-top: 0;
      }
      .year-block > .section-heading {
        border-bottom: 2px solid var(--ink);
        padding-bottom: 14px;
        margin: 0 0 6px;
      }
      .year-block > .section-heading h2 {
        font-family: Bentham, Georgia, serif;
        font-size: clamp(40px, 5vw, 58px);
        letter-spacing: -1.5px;
        text-transform: none;
        line-height: 1.05;
        color: var(--ink);
      }
      .year-block article {
        border-top: 1px solid var(--line);
        padding-top: 27px;
      }
      .year-block article:first-of-type {
        border-top: 0;
      }
      .year-block .post-title {
        margin: 2px 0 27px;
      }
      .year-block .article-label {
        font-size: 15px;
        letter-spacing: 0.2px;
        text-transform: none;
        color: var(--ink);
        font-weight: 800;
        margin: 24px 0 6px;
      }
      .year-block .post-copy {

        line-height: 1.85;
      }
      @media (max-width: 720px) {
        .year-block {
          margin-top: 44px;
        }
        .year-block .article-label {
          font-size: 14px;

        .year-block .post-copy {

      /* Nested monthly archive in the left sidebar */
      .sidebar nav {
        overflow-y: auto;

      }
      .nav-year:first-child {

      .navlink.nav-year-heading {

      .nav-months {

      .navlink.nav-month-link {

      .sidebar .navgroup {

      .sidebar-bottom {

        padding-top: 13px;
      }
      .hero-title {
        margin-top: 0;
      }
    </style>
  </head>

      <a href="#home" class="brand" aria-label="Economic Outlambdaook home"

        <div class="navgroup" style="margin-top: 35px">

      </nav>
      <div class="sidebar-bottom">

          >← halvorhansen.no</a
        >
      </div>
    </aside>
    <div class="shell">
      <main class="content" id="home">
        <header class="masthead">
          <h1 class="hero-title">
            <img
              src="./eo/eo.webp"
              alt="Economic Outlambdaook"
              class="hero-logo"
            />
          </h1>
        </header>
        <div id="latest" class="posts" aria-live="polite">
          <p class="loading-copy">Loading articles from the archive…</p>
        </div>
        <section class="newsletter" id="newsletter">
          <span class="eyebrow">Stay in the loop</span>
          <h2>New perspectives, in your inbox.</h2>
          <p>Occasional notes on economics and the world.</p>

          <form class="fake-form" id="brevo-form" method="POST">
            <input
              type="email"
              name="EMAIL"
              placeholder="Your email address"
              aria-label="Email address"
              required
            />
            <!-- Brevo hidden fields to prevent spam -->
            <input
              type="text"
              name="email_address_check"
              value=""
              class="input--hidden"
              style="display: none"
            />
            <input type="hidden" name="locale" value="en" />

            <button type="submit" id="submit-btn">Subscribe →</button>
          </form>

          <p id="demo-note" class="demo-note" style="display: none"></p>
        </section>

        <script>
          document
            .getElementById("brevo-form")
            .addEventListener("submit", function (e) {
              e.preventDefault(); // Stop the page from redirecting

              const form = this;
              const btn = document.getElementById("submit-btn");
              const note = document.getElementById("demo-note");

              // Give the user visual feedback that it's loading
              btn.innerText = "Subscribing...";
              btn.disabled = true;

              // Send the data to Brevo in the background
              fetch(form.action, {
                method: "POST",
                body: new FormData(form),
              })
                .then((response) => response.json())
                .then((data) => {
                  if (data.success) {
                    // Success! Hide the form and show the success message
                    form.style.display = "none";
                    note.innerText =
                      "Success! Please check your inbox to confirm your subscription.";
                    note.style.display = "block";
                  } else {
                    // Brevo returned an error (e.g., invalid email)
                    btn.innerText = "Subscribe →";
                    btn.disabled = false;
                    note.innerText =
                      data.message || "Something went wrong. Please try again.";
                    note.style.color = "red";
                    note.style.display = "block";
                  }
                })
                .catch((error) => {
                  // Network error
                  btn.innerText = "Subscribe →";
                  btn.disabled = false;
                  note.innerText = "Something went wrong. Please try again.";
                  note.style.color = "red";
                  note.style.display = "block";
                });
            });
        </script>
      </main>
    </div>
    <script>
      const sidebar = document.getElementById("sidebar");
      const toggle = document.getElementById("menu-toggle");
      const scrim = document.getElementById("scrim");
      function closeMenu() {
        sidebar.classList.remove("open");
        scrim.classList.remove("show");
        toggle.setAttribute("aria-expanded", "false");
      }
      toggle.addEventListener("click", () => {
        const open = !sidebar.classList.contains("open");
        sidebar.classList.toggle("open", open);
        scrim.classList.toggle("show", open);
        toggle.setAttribute("aria-expanded", String(open));
      });
      scrim.addEventListener("click", closeMenu);
      const months = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];
      const sheetId = "1cooW6kZlSKUgBjK4uPnv4cynbw3nM7NjwMjDHHFJ6mY";
      const apiKey = "AIzaSyABuVJIWSJiUqk01nvpYF4QVzmgyZDCaGc";
      const range = "EO2Response!A2:G";
      function escapeHTML(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function formatRichText(value) {
        // Only retain a narrow set of safe formatting tags from article CMS cells.
        const raw = String(value ?? "").replace(/<br\s*\/?\s*>/gi, "<br>");
        if (!/<\/?[a-z][^>]*>/i.test(raw))
          return escapeHTML(raw).replace(/\n/g, "<br>");
        const parsed = new DOMParser().parseFromString(
          "<div>" + raw + "</div>",
          "text/html",
        );
        const allowed = new Set([
          "P",
          "BR",
          "B",
          "STRONG",
          "I",
          "EM",
          "UL",
          "OL",
          "LI",
          "A",
          "H3",
          "H4",
          "BLOCKQUOTE",
        ]);
        function clean(n) {
          if (n.nodeType === Node.TEXT_NODE)
            return document.createTextNode(n.textContent);
          if (n.nodeType !== Node.ELEMENT_NODE)
            return document.createDocumentFragment();
          let frag = document.createDocumentFragment();
          for (const ch of [...n.childNodes]) frag.appendChild(clean(ch));
          if (!allowed.has(n.tagName)) return frag;
          let el = document.createElement(n.tagName.toLowerCase());
          if (n.tagName === "A") {
            let href = n.getAttribute("href") || "";
            if (/^https?:\/\//i.test(href)) {
              el.href = href;
              el.target = "_blank";
              el.rel = "noopener noreferrer";
            }
          }
          el.appendChild(frag);
          return el;
        }
        const holder = document.createElement("div");
        for (const child of [...parsed.body.firstElementChild.childNodes])
          holder.appendChild(clean(child));
        return holder.innerHTML;
      }
      function sourceHTML(value) {
        let t = escapeHTML(value || "");
        t = t.replace(
          /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
          (_, label, url) =>
            '<a href="' +
            url +
            '" target="_blank" rel="noopener noreferrer">' +
            label +
            "</a>",
        );
        t = t.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, (_, before, url) => {
          let trimmed = url.replace(/[.,;]+$/, "");
          return (
            before +
            '<a href="' +
            trimmed +
            '" target="_blank" rel="noopener noreferrer">' +
            trimmed +
            "</a>" +
            url.slice(trimmed.length)
          );
        });
        return t.replace(/\n/g, "<br>");
      }
      function parseYearMarker(s) {
        let match = String(s || "")
          .trim()
          .match(/^-+\s*(20\d{2})\s*-+$/);
        return match ? match[1] : null;
      }
      function dateYear(s) {
        const a = String(s || "").match(/(?:^|\D)(20\d{2})(?:\D|$)/);
        return a ? a[1] : null;
      }
      function parsePosts(rows) {
        // A marker such as "--- 2024 ---" CLOSES 2024 in this CMS.
        // Rows before it are from 2024; rows after it are from 2025.
        // The same convention applies to subsequent year-end markers.
        const markers = rows
          .map((row, i) => ({ i, year: parseYearMarker(row[0]) }))
          .filter((marker) => marker.year !== null);

        const firstMarker = markers[0];
        let sectionYear = firstMarker ? Number(firstMarker.year) : null;
        const entries = [];

        for (let i = 0; i < rows.length; i++) {
          const row = rows[i];
          const timestamp = String(row[0] || "").trim();
          const marker = parseYearMarker(timestamp);
          if (marker !== null) {
            sectionYear = Number(marker) + 1;
            continue;
          }

          const n = Number(String(row[1] || "").trim());
          if (!Number.isInteger(n) || n < 1 || n > 12) continue;

          // A real timestamp can supply a year where there are no markers.
          // Markers take precedence because timestamps may be missing,
          // or may represent form submission rather than publication.
          const year =
            sectionYear ??
            (dateYear(timestamp) ? Number(dateYear(timestamp)) : null);
          entries.push({
            month: n,
            monthName: months[n - 1],
            year: year === null ? "Archive" : String(year),
            stamp: timestamp,
            status: row[2] || "",
            prediction: row[3] || "",
            image: row[4] || "",
            sources: row[5] || "",
            caption: row[6] || "",
            index: i,
          });
        }

        // Chronological order, newest first. Sheet row order only breaks ties.
        return entries.sort(
          (a, b) =>
            (Number(b.year) || 0) - (Number(a.year) || 0) ||
            b.month - a.month ||
            b.index - a.index,
        );
      }
      function buildNavLink(parent, href, label, extraClass = "") {
        const a = document.createElement("a");
        a.href = href;
        a.className = "navlink " + extraClass;
        a.textContent = label;
        parent.appendChild(a);
      }
      function renderPosts(entries) {
        const out = document.getElementById("latest"),
          years = document.getElementById("year-navigation");
        out.innerHTML = "";
        years.innerHTML = "";
        if (!entries.length) {
          out.innerHTML =
            '<p class="loading-copy">No monthly entries found in the sheet.</p>';
          return;
        }
        let groups = new Map();
        for (const entry of entries) {
          if (!groups.has(entry.year)) groups.set(entry.year, []);
          groups.get(entry.year).push(entry);
        }
        for (const [year, posts] of groups) {
          let section = document.createElement("section");
          section.className = "year-block";
          section.id = "year-" + year;
          const heading = document.createElement("div");
          heading.className = "section-heading";
          heading.innerHTML =
            "<h2>" +
            (year === "Archive" ? "Archive" : escapeHTML(year)) +
            "</h2>";
          if (year !== String(new Date().getFullYear()))
            section.appendChild(heading);
          const navYear = document.createElement("div");
          navYear.className = "nav-year";
          if (year !== String(new Date().getFullYear()))
            buildNavLink(navYear, "#year-" + year, year, "nav-year-heading");
          const navMonths = document.createElement("div");
          navMonths.className = "nav-months";
          navYear.appendChild(navMonths);
          years.appendChild(navYear);
          for (const post of posts) {
            const id = "post-" + post.index;
            const article = document.createElement("article");
            article.id = id;
            const dated =
              post.stamp && !parseYearMarker(post.stamp)
                ? '<span class="dot"></span><span>' +
                  escapeHTML(post.stamp) +
                  "</span>"
                : "";
            const image = /^https?:\/\//i.test(post.image) ? post.image : "";
            article.innerHTML =
              '<div class="meta">' +
              '</div><h2 class="post-title">' +
              escapeHTML(post.monthName) +
              "</h2>" +
              (post.status
                ? '<div class="article-label">World status</div><div class="post-copy rich-copy">' +
                  formatRichText(post.status) +
                  "</div>"
                : "") +
              (post.prediction
                ? '<div class="article-label">World prediction</div><div class="post-copy rich-copy">' +
                  formatRichText(post.prediction) +
                  "</div>"
                : "") +
              (image
                ? '<img class="post-image" loading="lazy" alt="' +
                  escapeHTML(
                    post.caption || post.monthName + " article figure",
                  ) +
                  '">'
                : "") +
              (post.caption
                ? '<p class="caption">' + escapeHTML(post.caption) + "</p>"
                : "") +
              (post.sources
                ? '<p class="source-list"><strong>Sources:</strong><br>' +
                  sourceHTML(post.sources) +
                  "</p>"
                : "");
            if (image) {
              let imageEl = article.querySelector("img.post-image");
              imageEl.src = image;
              imageEl.referrerPolicy = "no-referrer";
              imageEl.addEventListener("error", () => imageEl.remove());
            }
            section.appendChild(article);
            buildNavLink(
              navMonths,
              "#" + id,
              post.monthName.slice(0, 3),
              "nav-month-link",
            );
          }
          out.appendChild(section);
        }
        document.querySelectorAll(".navlink").forEach((a) =>
          a.addEventListener("click", () => {
            document
              .querySelectorAll(".navlink")
              .forEach((l) => l.classList.remove("active"));
            a.classList.add("active");
            closeMenu();
          }),
        );
        const seen = ["home", "latest", ...groups.keys()]
          .filter((x) => x !== "Archive")
          .map((x) => (/^\d{4}$/.test(String(x)) ? "year-" + x : x))
          .concat([...entries.map((e) => "post-" + e.index), "newsletter"]);
        const observer = new IntersectionObserver(
          (entries) => {
            const visible = entries
              .filter((e) => e.isIntersecting)
              .sort(
                (a, b) => a.boundingClientRect.top - b.boundingClientRect.top,
              );
            if (!visible.length) return;
            const id = visible[0].target.id;
            const a = document.querySelector('.navlink[href="#' + id + '"]');
            if (a) {
              document
                .querySelectorAll(".navlink")
                .forEach((l) => l.classList.remove("active"));
              a.classList.add("active");
            }
          },
          { rootMargin: "-10% 0px -75% 0px", threshold: 0 },
        );
        seen.forEach((id) => {
          const el = document.getElementById(id);
          if (el) observer.observe(el);
        });
      }
      async function fetchBlogPosts() {
        const out = document.getElementById("latest");
        try {
          const url =
            "https://sheets.googleapis.com/v4/spreadsheets/" +
            sheetId +
            "/values/" +
            encodeURIComponent(range) +
            "?key=" +
            encodeURIComponent(apiKey);
          const response = await fetch(url);
          if (!response.ok)
            throw new Error("Google Sheets returned HTTP " + response.status);
          const data = await response.json();
          if (!Array.isArray(data.values))
            throw new Error("No sheet data returned");
          renderPosts(parsePosts(data.values));
        } catch (err) {
          console.error("Failed to load articles:", err);
          out.innerHTML =
            '<p class="loading-copy">Could not load the article archive. Check that the sheet is accessible and that the sheet tab name in the code is correct.</p>';
        }
      }
      fetchBlogPosts();
    </script>
  </body>
</html>
