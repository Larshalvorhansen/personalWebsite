    <script>
      async function fetchBlogPosts() {
        try {
          const sheetId = "1cooW6kZlSKUgBjK4uPnv4cynbw3nM7NjwMjDHHFJ6mY";
          const apiKey = "AIzaSyABuVJIWSJiUqk01nvpYF4QVzmgyZDCaGc";
          const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Sheet2!A2:D?key=${apiKey}`;

          const response = await fetch(url);
          const data = await response.json();

          if (!data.values) {
            throw new Error("Ingen data returnert fra Google Sheets.");
          }

          const posts = data.values.reverse(); // Reverse the order of the posts
          const postsContainer = document.getElementById("posts-container");
          postsContainer.innerHTML = ""; // Tøm gamle innlegg
          postsContainer.removeAttribute("aria-busy");

          posts.forEach((post, index) => {
            const [date, title, content, imageUrl] = post;

            const postElement = document.createElement("div");
            postElement.classList.add(
              "blog-post",
              "bg-white",
              "shadow-lg",
              "rounded-lg",
              "p-6",
            );

            const titleElement = document.createElement("h2");
            titleElement.textContent = title;
            titleElement.classList.add("text-2xl", "font-semibold", "mb-2");

            const dateElement = document.createElement("small");
            dateElement.textContent = date;
            dateElement.classList.add("text-gray-500", "text-sm", "mb-4");

            const contentElement = document.createElement("p");
            contentElement.innerHTML = content.replace(/\n/g, "<br>");
            contentElement.classList.add("text-gray-700");

            postElement.appendChild(titleElement);
            postElement.appendChild(dateElement);
            postElement.appendChild(contentElement);

            // Only append image if imageUrl exists and is not empty
            if (imageUrl && imageUrl.trim() !== "") {
              const imageElement = document.createElement("img");
              imageElement.src = imageUrl;
              imageElement.classList.add(
                "w-full",
                "h-64",
                "object-cover",
                "rounded-md",
                "mb-4",
              );
              postElement.appendChild(imageElement);
            }

            postsContainer.appendChild(postElement);
          });
        } catch (error) {
          console.error("Feil under henting av blogginnlegg:", error);
        }
      }

      window.onload = fetchBlogPosts;
    </script>
